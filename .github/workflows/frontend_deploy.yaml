name: Deploy Application
on:
  push:
    branches:
      - dev
    paths:
      - 'frontend_web/**'
      - '.github/workflows/frontend_deploy.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Copy Code
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PROMACT_SERVER_IP }}
          username: ${{ secrets.PROMACT_SERVER_USERNAME }}
          key: ${{ secrets.PROMACT_SERVER_SSH_PRIVATE_KEY }}
          source: "."
          target: "Internship-2025/Mentor-Mentee-App/"

      - name: Create or Overwrite .env File
        uses: appleboy/ssh-action@master
        with:
          host: '${{ secrets.PROMACT_SERVER_IP }}'
          username: '${{ secrets.PROMACT_SERVER_USERNAME }}'
          key: '${{ secrets.PROMACT_SERVER_SSH_PRIVATE_KEY }}'
          script: |
            cd /home/intern/Internship-2025/Mentor-Mentee-App
            cat > .env <<EOL
            MM_AI=${{ secrets.MM_AI }}
            MM_FRONTEND=${{ secrets.MM_FRONTEND }}
            MM_BACKEND=${{ secrets.MM_BACKEND }}
            VITE_SERVER_ENDPOINT=${{ secrets.VITE_SERVER_ENDPOINT }}
            EOL
            echo ".env file created/updated successfully."

      - name: Create or Overwrite .env File for frontend
        uses: appleboy/ssh-action@master
        with:
          host: '${{ secrets.PROMACT_SERVER_IP }}'
          username: '${{ secrets.PROMACT_SERVER_USERNAME }}'
          key: '${{ secrets.PROMACT_SERVER_SSH_PRIVATE_KEY }}'
          script: |
            cd /home/intern/Internship-2025/Mentor-Mentee-App/frontend_web
            cat > .env <<EOL
            VITE_SERVER_ENDPOINT=${{ secrets.VITE_SERVER_ENDPOINT }}
            EOL
            echo ".env file created/updated successfully."

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROMACT_SERVER_IP }}
          username: ${{ secrets.PROMACT_SERVER_USERNAME }}
          key: ${{ secrets.PROMACT_SERVER_SSH_PRIVATE_KEY }}
          script: |
            cd /home/intern/Internship-2025/Mentor-Mentee-App
            docker compose down
            docker compose up -d --build frontend
            docker system prune -af